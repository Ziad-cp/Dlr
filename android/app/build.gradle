plugins {
    id 'com.android.application'
}

// The same version number as the desktop app (app.py).
def appVersion = (rootProject.file('../app.py').text =~ /__version__ = "([^"]+)"/)[0][1]
def versionParts = appVersion.tokenize('.').collect { it as int }

android {
    namespace 'io.github.ziadcp.dlr'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.ziadcp.dlr'
        minSdk 29          // Android 10: saving to Downloads needs no permission from here on
        targetSdk 35
        versionName appVersion
        versionCode versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // Release signing key from the environment (GitHub secrets in CI). Without one, the
    // release APK is signed with the debug key, which is fine for testing.
    signingConfigs {
        release {
            if (System.getenv('DLR_KEYSTORE')) {
                storeFile file(System.getenv('DLR_KEYSTORE'))
                storePassword System.getenv('DLR_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DLR_KEY_ALIAS')
                keyPassword System.getenv('DLR_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('DLR_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    // One APK per processor type keeps each download small (Python and FFmpeg are big).
    // -PuniversalApk builds a single APK for every type instead (used for the emulator tests).
    splits {
        abi {
            enable !project.hasProperty('universalApk')
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true  // yt-dlp's Python and FFmpeg must be real files to run
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // yt-dlp, Python and FFmpeg for Android (https://github.com/yausername/youtubedl-android)
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    // Keeps the Kotlin runtime pieces those libraries use on one version.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.25')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
