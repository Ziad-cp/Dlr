# Builds the downloadable apps on GitHub's Mac and Windows computers.
#
# Every push: builds and tests the Mac (Apple chip and Intel) and Windows apps. They can be
#             downloaded from the run's "Artifacts" for testing.
# A tag v1.2.3: also publishes them as a GitHub Release, where anyone can download them:
#             git tag v1.1.0 && git push origin v1.1.0   (must match __version__ in app.py)
name: Build apps

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac (Apple chip)
            os: macos-15
            file: Dlr-Mac-Apple-Silicon.dmg
          - name: Mac (Intel)
            os: macos-15-intel
            file: Dlr-Mac-Intel.dmg
          - name: Windows
            os: windows-2022
            file: Dlr-Windows-Setup.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: python -m pip install --no-cache-dir --disable-pip-version-check -r requirements.txt

      - name: Download and check FFmpeg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python packaging/get_ffmpeg.py

      - name: Build the app
        run: python build.py

      - name: Make the Mac disk image
        if: runner.os == 'macOS'
        run: mv dist/Dlr-*.dmg "dist/${{ matrix.file }}"

      - name: Make the Windows installer
        if: runner.os == 'Windows'
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -x "$ISCC" ]; then choco install innosetup -y --no-progress; fi
          VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('app.py').read()).group(1))")
          "$ISCC" "/DAppVersion=$VERSION" packaging/windows/dlr.iss

      - name: Test that the app starts and finds its FFmpeg
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            APP=dist/Dlr.app/Contents/MacOS/Dlr
            "$APP" --version
            ls dist/Dlr.app/Contents/Frameworks/ffmpeg/ffmpeg dist/Dlr.app/Contents/Frameworks/ffmpeg/ffprobe
            dist/Dlr.app/Contents/Frameworks/ffmpeg/ffmpeg -hide_banner -version | head -n 1
          else
            APP=dist/Dlr/Dlr.exe
            "$APP" --version
            dist/Dlr/_internal/ffmpeg/ffmpeg.exe -hide_banner -version | head -n 1
            dist/Dlr/_internal/ffmpeg/ffprobe.exe -hide_banner -version | head -n 1
          fi

      - name: Test a real download (may fail if the site blocks GitHub's computers)
        continue-on-error: true
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then APP=dist/Dlr.app/Contents/MacOS/Dlr; else APP=dist/Dlr/Dlr.exe; fi
          mkdir -p test-download
          "$APP" --download "https://www.youtube.com/watch?v=jNQXAC9IVRw" video "$PWD/test-download"
          "$APP" --download "https://www.youtube.com/watch?v=jNQXAC9IVRw" mp3 "$PWD/test-download"
          ls -la test-download
          ls test-download/*.mp4 test-download/*.mp3

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: dist/${{ matrix.file }}
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app's version
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app.py)
          [ "$GITHUB_REF_NAME" = "v$VERSION" ] || { echo "Tag $GITHUB_REF_NAME doesn't match app.py version $VERSION"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd files
          sha256sum * > SHA256SUMS.txt
          cat > ../notes.md <<'EOF'
          ## Download

          | Your computer | Download |
          | --- | --- |
          | **Windows 10 or 11** | **Dlr-Windows-Setup.exe** |
          | **Mac with an Apple chip** (M1, M2, M3, M4…) | **Dlr-Mac-Apple-Silicon.dmg** |
          | **Mac with an Intel chip** (older Macs) | **Dlr-Mac-Intel.dmg** |

          Not sure which Mac you have? Click the Apple menu (top-left corner of the screen) › **About This Mac**. "Chip: Apple M…" means Apple chip; "Processor: … Intel" means Intel.

          Everything Dlr needs is included. You don't need to install anything else.
          Step-by-step instructions: https://github.com/Ziad-cp/Dlr#download-and-install
          EOF
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" \
            --title "Dlr ${GITHUB_REF_NAME#v}" --notes-file ../notes.md
