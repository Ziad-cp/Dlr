# Builds the Mac app (Apple chips) on GitHub's Mac computers.
#
# Every push: builds and tests Dlr-mac-apple-silicon.dmg. It can be downloaded from the run's
#             "Artifacts" for testing.
# A tag v1.2.3: also publishes it as a GitHub Release, with its SHA-256 checksum. The file name
#             never changes between versions, so this link always gives the newest one:
#             https://github.com/Ziad-cp/Dlr/releases/latest/download/Dlr-mac-apple-silicon.dmg
#             Either push a tag (git tag v1.1.0 && git push origin v1.1.0), or on GitHub:
#             Releases › Draft a new release › tag v1.1.0 › Publish. The files are added
#             about 10 minutes later. The tag must match __version__ in app.py.
name: Build the Mac app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DMG: Dlr-mac-apple-silicon.dmg

jobs:
  build:
    name: Mac (Apple chip)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: python -m pip install --no-cache-dir --disable-pip-version-check -r requirements.txt

      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -t . -v

      - name: Download and check FFmpeg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python packaging/get_ffmpeg.py

      - name: Download and check Deno
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python packaging/get_deno.py

      - name: Build the app
        run: python build.py

      - name: Name the disk image
        run: mv dist/Dlr-*.dmg "dist/$DMG"

      - name: Test that the app starts and finds its FFmpeg, Deno and gallery-dl
        timeout-minutes: 5
        run: |
          APP=dist/Dlr.app/Contents/MacOS/Dlr
          "$APP" --version 2>&1 | tee version.txt
          grep -q "^Dlr " version.txt
          grep -q "^FFmpeg: .*Frameworks/ffmpeg" version.txt   # its own, not one on the computer
          grep -q "^Deno: .*Frameworks/deno" version.txt
          grep -Eq "^gallery-dl: [0-9]" version.txt
          grep -q "^Impersonation (TikTok): yes" version.txt

      - name: Test real downloads (video with conversion to H.264, and MP3)
        timeout-minutes: 10
        run: |
          APP=dist/Dlr.app/Contents/MacOS/Dlr
          mkdir -p test-download
          ok=0
          # Public test videos from sites that don't block GitHub's computers. The first is an
          # old Ogg/Theora file, so Dlr has to convert it to an MP4 that plays everywhere.
          for url in "https://download.blender.org/peach/trailer/trailer_400p.ogg" \
                     "https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4"; do
            if "$APP" --download "$url" video "$PWD/test-download" 2>&1 | tee -a downloads.txt &&
               "$APP" --download "$url" mp3 "$PWD/test-download" 2>&1 | tee -a downloads.txt; then
              ok=1; break
            fi
          done
          ls -la test-download
          [ "$ok" = 1 ]
          ls test-download/*.mp4 test-download/*.mp3

      # YouTube, TikTok, Instagram and Reddit block GitHub's computers (datacenter addresses),
      # so these downloads can't be tested here: the step shows as skipped (grey), never as a
      # green tick. Run tests/live_links.py on a Mac instead. To run it here anyway (e.g. on a
      # self-hosted runner), set the repository variable RUN_SOCIAL_TESTS to true.
      - name: Social-media link tests — SKIPPED on GitHub (sites block datacenter IPs; run tests/live_links.py on a Mac)
        if: vars.RUN_SOCIAL_TESTS == 'true'
        timeout-minutes: 60
        run: CI= python tests/live_links.py --app dist/Dlr.app

      - name: Say which tests were skipped
        if: vars.RUN_SOCIAL_TESTS != 'true'
        run: |
          echo "::notice title=Social-media tests skipped::YouTube, TikTok, Instagram, Reddit, X, Facebook and Spotify downloads aren't tested on GitHub (these sites block datacenter IPs). Run python tests/live_links.py on a Mac."
          {
            echo "### Skipped: social-media downloads"
            echo "These sites block GitHub's computers, so they're **not tested here** (not passed either)."
            echo "Run \`python tests/live_links.py --app dist/Dlr.app\` on a Mac before a release."
            echo
            echo "| Site | Cases | Status |"
            echo "| --- | --- | --- |"
            echo "| YouTube | video, picked quality, MP3 | skipped |"
            echo "| TikTok | video, slideshow, share link | skipped |"
            echo "| Instagram | reel, photo, carousel, share link | skipped |"
            echo "| Reddit | video with sound, gallery, share link | skipped |"
            echo "| X, Facebook | video | skipped |"
            echo "| Spotify | track, album, playlist | skipped |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open the app and take a screenshot
        timeout-minutes: 5
        run: |
          mkdir -p screenshots
          open dist/Dlr.app
          sleep 25
          pgrep -x Dlr >/dev/null || { echo "Dlr closed by itself"; exit 1; }
          screencapture -x "screenshots/Dlr-mac.png" || echo "::warning::No screenshot"
          pkill -x Dlr || true

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshot-mac
          path: screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.DMG }}
          path: dist/${{ env.DMG }}
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the app's version
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app.py)
          [ "$GITHUB_REF_NAME" = "v$VERSION" ] || { echo "Tag $GITHUB_REF_NAME doesn't match app.py version $VERSION"; exit 1; }

      - uses: actions/download-artifact@v6
        with:
          name: ${{ env.DMG }}
          path: files

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd files
          sha256sum "$DMG" > "$DMG.sha256"
          cat > ../notes.md <<'EOF'
          ## Download

          **Dlr-mac-apple-silicon.dmg**: for Macs with an Apple chip (M1 or newer), macOS 12 Monterey or newer.

          **Mac: Apple Silicon (M1 or newer) only.** To check, click the Apple menu (top-left corner of the screen) › **About This Mac**: it should say "Chip: Apple M…".

          **Mac, first launch:** open the .dmg and drag Dlr to Applications, then open Dlr. When macOS says it can't check Dlr, click **Done**, go to **System Settings › Privacy & Security**, scroll down and click **Open Anyway**, enter your password, then click **Open**.

          Everything Dlr needs is included (yt-dlp, gallery-dl, FFmpeg and Deno). You don't need to install anything else.
          Step-by-step instructions: https://github.com/Ziad-cp/Dlr#download
          EOF
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The release was created on the GitHub website: add the files (and notes if it has none).
            gh release upload "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" --clobber --repo "$GITHUB_REPOSITORY"
            if [ -z "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body)" ]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file ../notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" --repo "$GITHUB_REPOSITORY" \
              --title "Dlr ${GITHUB_REF_NAME#v}" --notes-file ../notes.md
          fi
